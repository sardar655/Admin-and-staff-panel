<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Dashboard - Shaik Enterprises</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-4 max-w-md mx-auto font-sans">

  <div class="bg-gradient-to-r from-blue-800 to-indigo-900 p-4 rounded-2xl shadow-lg mb-4 text-center">
    <h1 class="text-xl font-black uppercase text-orange-400">OWNER DASHBOARD</h1>
    <p class="text-xs text-gray-300">Shaik Enterprises – Admin Portal</p>
  </div>

  <!-- Live Stats Display -->
  <div class="grid grid-cols-2 gap-3 mb-4">
    <div class="bg-gray-800 p-4 rounded-xl text-center border border-gray-700">
      <p class="text-xs text-gray-400 uppercase font-bold">Total Day Sales</p>
      <p id="totalSales" class="text-2xl font-black text-green-400 mt-1">₹0</p>
    </div>
    <div class="bg-gray-800 p-4 rounded-xl text-center border border-gray-700">
      <p class="text-xs text-gray-400 uppercase font-bold">Total Boxes Sold</p>
      <p id="totalBoxes" class="text-2xl font-black text-blue-400 mt-1">0 Bxs</p>
    </div>
  </div>

  <div class="bg-gray-800 p-4 rounded-xl space-y-3 border border-gray-700 text-sm">
    <div class="flex justify-between border-b border-gray-700 pb-2">
      <span class="text-gray-400">Salesman Name:</span>
      <span id="salesmanNameDisplay" class="font-bold text-white">--</span>
    </div>
    <div class="flex justify-between border-b border-gray-700 pb-2">
      <span class="text-gray-400">Total Visits:</span>
      <span id="totalVisits" class="font-bold text-blue-400">0</span>
    </div>
    <div class="flex justify-between border-b border-gray-700 pb-2">
      <span class="text-gray-400">Total Orders:</span>
      <span id="totalOrders" class="font-bold text-green-400">0</span>
    </div>
    <div class="flex justify-between">
      <span class="text-gray-400">Cash Collection:</span>
      <span id="totalCash" class="font-bold text-emerald-400">₹0</span>
    </div>
  </div>

  <button onclick="loadOwnerData()" class="w-full mt-4 bg-orange-500 hover:bg-orange-600 text-slate-900 font-extrabold py-3 rounded-xl shadow active:scale-95 transition uppercase text-xs">
    🔄 Refresh Data Now
  </button>

  <script>
    function loadOwnerData() {
      const saved = localStorage.getItem('craveman_live_data');
      if (saved) {
        const data = JSON.parse(saved);
        document.getElementById('totalSales').innerText = '₹' + (data.sale || 0);
        document.getElementById('totalBoxes').innerText = (data.boxes || 0) + ' Bxs';
        document.getElementById('salesmanNameDisplay').innerText = data.name || 'Raju';
        document.getElementById('totalVisits').innerText = data.visits || 0;
        document.getElementById('totalOrders').innerText = data.orders || 0;
        document.getElementById('totalCash').innerText = '₹' + (data.cash || 0);
      }
    }

    // Listen for real-time messages from the salesman tab/device if open together
    const channel = new BroadcastChannel('craveman_sync_channel');
    channel.onmessage = (event) => {
      loadOwnerData();
    };

    // Auto-load on open
    window.onload = loadOwnerData;
  </script>
</body>
</html>

      { id: 3, name: "Cup Butterscotch 50ml", pack: 48, mrp: 5 },

      { id: 5, name: "Cup Vanilla 70ml", pack: 36, mrp: 10 },
      { id: 6, name: "Cup Butterscotch 70ml", pack: 36, mrp: 10 },
      { id: 7, name: "Cup Chocolate 70ml", pack: 36, mrp: 10 },

      { id: 9, name: "Candy Mango 60ml", pack: 36, mrp: 10 },
      { id: 10, name: "Junior Chocobar 40ml", pack: 40, mrp: 10 },
      { id: 11, name: "Big Chocobar 60ml", pack: 30, mrp: 20 },
      { id: 12, name: "Med Cone Vanilla 60ml", pack: 24, mrp: 20 },
      { id: 13, name: "Med Cone Butterscotch 60ml", pack: 24, mrp: 20 },
      { id: 14, name: "Big Cone Chocolate 110ml", pack: 20, mrp: 30 },
      { id: 15, name: "Kulfi Stick Malai Mawa 60ml", pack: 30, mrp: 20 }
    ];

    let adminVanStock = JSON.parse(localStorage.getItem('craveman_van_stock')) || {};

    function loadAdminData() {
      const stats = JSON.parse(localStorage.getItem('craveman_day_stats')) || {
        visits: 0, orders: 0, boxes: 0, sales: 0, totalCash: 0, totalUpi: 0, kmTravelled: 0, history: []
      };

      document.getElementById("adminTotalSales").innerText = `₹${stats.sales.toFixed(0)}`;
      document.getElementById("adminTotalBoxes").innerText = `${stats.boxes} Bxs`;
      document.getElementById("adminVisits").innerText = stats.visits;
      document.getElementById("adminOrders").innerText = stats.orders;
      document.getElementById("adminKm").innerText = `${(stats.kmTravelled || 0).toFixed(1)} KM`;
      document.getElementById("adminCash").innerText = `₹${(stats.totalCash || 0).toFixed(0)}`;
      document.getElementById("adminUpi").innerText = `₹${(stats.totalUpi || 0).toFixed(0)}`;

      // Van stock summary
      adminVanStock = JSON.parse(localStorage.getItem('craveman_van_stock')) || {};
      let totalLoaded = 0;
      let totalBalance = 0;
      Object.keys(adminVanStock).forEach(id => {
        totalLoaded += adminVanStock[id].loaded || 0;
        totalBalance += Math.max(0, (adminVanStock[id].loaded || 0) - (adminVanStock[id].sold || 0));
      });

      document.getElementById("adminVanStockSummary").innerHTML = totalLoaded === 0 ? 
        `<span class="text-rose-600 font-bold">Van stock not assigned yet. Click Godown Dispatch.</span>` :
        ` Total Loaded: <span class="font-black text-gray-900">${totalLoaded} bxs</span> | Remaining in Van: <span class="font-black text-indigo-700">${totalBalance} bxs</span>`;

      // History Feed
      const feed = document.getElementById("adminHistoryFeed");
      feed.innerHTML = "";

      if (!stats.history || stats.history.length === 0) {
        feed.innerHTML = `<p class="text-xs text-gray-400 text-center py-4">No records found from salesman yet.</p>`;
      } else {
        stats.history.slice().reverse().forEach((h) => {
          const card = document.createElement("div");
          card.className = "p-2.5 rounded-xl border text-xs bg-gray-50";

          if (h.type === "ORDER") {
            card.className += " border-emerald-200 bg-emerald-50/40";
            card.innerHTML = `
              <div class="flex justify-between items-start font-black text-gray-800">
                <span>${h.shop}</span>
                <span class="text-[10px] text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded">₹${h.total}</span>
              </div>
              <div class="text-[10px] text-gray-500 mt-0.5">Salesman: ${h.salesman} •  ${h.time}</div>
              <div class="text-[11px] font-bold text-indigo-700 mt-1">Boxes: ${h.boxes} bxs | Cash: ₹${h.cash} | UPI: ₹${h.upi}</div>
            `;
          } else {
            card.className += " border-rose-200 bg-rose-50/40";
            card.innerHTML = `
              <div class="flex justify-between items-start font-black text-gray-800">
                <span>${h.shop}</span>
                <span class="text-[10px] text-rose-700 bg-rose-100 px-2 py-0.5 rounded">NO ORDER</span>
              </div>
              <div class="text-[10px] text-gray-500 mt-0.5">Salesman: ${h.salesman} •  ${h.time}</div>
              <div class="text-[11px] font-semibold text-gray-700 mt-1">Reason: ${h.reason}</div>
            `;
          }
          feed.appendChild(card);
        });
      }
    }

    function openGodownLoadModal() {
      const list = document.getElementById("godownStockList");
      list.innerHTML = "";

      menuData.forEach(p => {
        const current = adminVanStock[p.id] ? adminVanStock[p.id].loaded : 0;
        const row = document.createElement("div");
        row.className = "p-2 bg-gray-50 rounded-xl border flex items-center justify-between";
        row.innerHTML = `
          <div class="w-3/5 pr-1 font-semibold text-gray-800">${p.name}</div>
          <div class="w-2/5 flex items-center justify-end">
            <input type="number" min="0" value="${current}" id="godown_load_${p.id}" class="w-16 border rounded p-1 text-center font-bold text-xs bg-white">
          </div>
        `;
        list.appendChild(row);
      });

      document.getElementById("godownModal").classList.remove("hidden");
    }

    function closeGodownLoadModal() {
      document.getElementById("godownModal").classList.add("hidden");
    }

    function saveGodownDispatch() {
      menuData.forEach(p => {
        const input = document.getElementById(`godown_load_${p.id}`);
        const val = input ? (parseInt(input.value) || 0) : 0;
        const prevSold = adminVanStock[p.id] ? adminVanStock[p.id].sold : 0;

        adminVanStock[p.id] = { loaded: val, sold: prevSold };
      });

      localStorage.setItem('craveman_van_stock', JSON.stringify(adminVanStock));
      loadAdminData();
      closeGodownLoadModal();
      alert("Van Stock Dispatched Successfully from Godown!");
    }
